[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "multiphoton-star-toolbox"
version = "0.1.0"
description = "Pulse design, simulation, and reconstruction for multiphoton STAR MRI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.22,<2", "scipy", "matplotlib", "finufft", "tqdm"]

[tool.setuptools.packages.find]
where = ["src"]
